query Properties($page: Int, $limit: Int) {
  properties(page: $page, limit: $limit) {
    data {
      id
      title
      slug
      slugEn
      description
      priceUS
      priceBS
      address
      bedrooms
      bathrooms
      totalArea
      coveredArea
      latitude
      longitude
      status
      priority
      createdAt
      propertyTypeId
      dealTypeId
      cityId
      zoneId
      userId
      media {
        id
        url
        type
        order
      }
    }
    meta {
      total
      page
      limit
      totalPages
    }
  }
}

query Property($id: String!) {
  property(id: $id) {
    id
    title
    titleEn
    slug
    slugEn
    description
    descriptionEn
    priceUS
    priceBS
    phoneNumber
    address
    bedrooms
    bathrooms
    totalArea
    coveredArea
    parkingSpaces
    latitude
    longitude
    status
    priority
    yearBuilt
    furnished
    petsAllowed
    maintenanceFee
    propertyTax
    availableFrom
    virtualTourUrl
    floorPlanUrl
    condition
    stories
    elevators
    heating
    cooling
    security
    pool
    balcony
    terrace
    storage
    createdAt
    updatedAt
    propertyTypeId
    dealTypeId
    cityId
    zoneId
    stateId
    countryId
    userId
    agencyId
    media {
      id
      url
      type
      order
    }
    user {
      id
      email
      profile {
        firstName
        lastName
      }
    }
  }
}

query SearchProperties(
  $query: String
  $filters: PropertyFiltersInput
  $page: Int
  $limit: Int
) {
  searchProperties(
    input: { query: $query, filters: $filters, page: $page, limit: $limit }
  ) {
    data {
      id
      title
      slug
      slugEn
      description
      priceUS
      priceBS
      address
      bedrooms
      bathrooms
      totalArea
      coveredArea
      latitude
      longitude
      status
      priority
      createdAt
      propertyTypeId
      dealTypeId
      cityId
      zoneId
      userId
      media {
        id
        url
        type
        order
      }
    }
    meta {
      total
      page
      limit
      totalPages
    }
  }
}

mutation CreateProperty($input: CreatePropertyInput!) {
  createProperty(createPropertyInput: $input) {
    id
    title
    titleEn
    description
    descriptionEn
    priceUS
    priceBS
    address
    bedrooms
    bathrooms
    totalArea
    coveredArea
    parkingSpaces
    latitude
    longitude
    status
    yearBuilt
    furnished
    pool
    balcony
    terrace
    security
    storage
    petsAllowed
    propertyTypeId
