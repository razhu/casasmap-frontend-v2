query MarketAnalysis($input: MarketAnalysisInput!) {
  marketAnalysis(input: $input) {
    cityId
    cityName
    propertyTypeId
    propertyTypeName
    totalProperties
    averagePriceUS
    averagePriceBS
    medianPriceUS
    medianPriceBS
    minPriceUS
    maxPriceUS
    averageArea
    pricePerSqmUS
    priceDistribution {
      range
      count
      percentage
    }
    propertyTypeDistribution {
      propertyType
      count
      percentage
      averagePrice
    }
  }
}

query StatesForReports($countryId: Int!) {
  states(countryId: $countryId) {
    id
    name
    cities {
      id
      name
    }
  }
}
