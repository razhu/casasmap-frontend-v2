query MyConversations {
  myConversations {
    id
    participant1Id
    participant2Id
    propertyId
    lastMessageAt
    createdAt
    messages {
      id
      content
      senderId
      createdAt
      readAt
    }
  }
}

query ConversationMessages($conversationId: String!) {
  conversationMessages(conversationId: $conversationId) {
    id
    conversationId
    senderId
    receiverId
    propertyId
    content
    status
    readAt
    createdAt
  }
}
