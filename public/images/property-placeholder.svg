<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dbeafe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#bfdbfe;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGradient)"/>
  
  <!-- House icon -->
  <g transform="translate(300, 180)">
    <!-- Roof -->
    <path d="M100 40 L200 100 L200 80 L220 80 L220 120 L240 120 L100 20 L-40 120 L-20 120 L-20 80 L0 80 L0 100 Z" 
          fill="#3b82f6" opacity="0.9"/>
    
    <!-- House body -->
    <rect x="0" y="100" width="200" height="140" fill="#60a5fa" opacity="0.9" rx="4"/>
    
    <!-- Door -->
    <rect x="75" y="160" width="50" height="80" fill="#1e40af" opacity="0.9" rx="4"/>
    <circle cx="115" cy="200" r="3" fill="#dbeafe"/>
    
    <!-- Windows -->
    <rect x="20" y="120" width="50" height="50" fill="#dbeafe" opacity="0.9" rx="4"/>
    <rect x="130" y="120" width="50" height="50" fill="#dbeafe" opacity="0.9" rx="4"/>
    
    <!-- Window frames -->
    <line x1="45" y1="120" x2="45" y2="170" stroke="#3b82f6" stroke-width="2"/>
    <line x1="20" y1="145" x2="70" y2="145" stroke="#3b82f6" stroke-width="2"/>
    <line x1="155" y1="120" x2="155" y2="170" stroke="#3b82f6" stroke-width="2"/>
    <line x1="130" y1="145" x2="180" y2="145" stroke="#3b82f6" stroke-width="2"/>
  </g>
  
  <!-- Text -->
  <text x="400" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="24" 
        fill="#64748b" text-anchor="middle" font-weight="500">
    No Image Available
  </text>
  <text x="400" y="450" font-family="system-ui, -apple-system, sans-serif" font-size="16" 
        fill="#94a3b8" text-anchor="middle">
    Property image will appear here
  </text>
</svg>
