<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Modern gradient background -->
  <defs>
    <linearGradient id="modernBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f9ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#e0f2fe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#bae6fd;stop-opacity:1" />
    </linearGradient>
    
    <!-- Icon gradient -->
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="url(#modernBg)"/>
  
  <!-- Decorative circles -->
  <circle cx="100" cy="100" r="60" fill="#3b82f6" opacity="0.05"/>
  <circle cx="700" cy="500" r="80" fill="#3b82f6" opacity="0.05"/>
  <circle cx="650" cy="150" r="40" fill="#3b82f6" opacity="0.05"/>
  
  <!-- Modern house icon -->
  <g transform="translate(280, 180)">
    <!-- Building outline -->
    <rect x="40" y="80" width="160" height="180" fill="none" stroke="url(#iconGradient)" 
          stroke-width="3" rx="8" opacity="0.8"/>
    
    <!-- Roof line -->
    <path d="M 30 80 L 120 20 L 210 80" fill="none" stroke="url(#iconGradient)" 
          stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
    
    <!-- Windows grid -->
    <rect x="70" y="110" width="35" height="35" fill="none" stroke="#3b82f6" 
          stroke-width="2" rx="4" opacity="0.6"/>
    <rect x="135" y="110" width="35" height="35" fill="none" stroke="#3b82f6" 
          stroke-width="2" rx="4" opacity="0.6"/>
    <rect x="70" y="165" width="35" height="35" fill="none" stroke="#3b82f6" 
          stroke-width="2" rx="4" opacity="0.6"/>
    <rect x="135" y="165" width="35" height="35" fill="none" stroke="#3b82f6" 
          stroke-width="2" rx="4" opacity="0.6"/>
    
    <!-- Door -->
    <rect x="95" y="220" width="50" height="40" fill="url(#iconGradient)" 
          rx="4" opacity="0.7"/>
    <circle cx="130" cy="240" r="2" fill="white"/>
  </g>
  
  <!-- Text -->
  <text x="400" y="420" font-family="system-ui, -apple-system, sans-serif" 
        font-size="22" fill="#475569" text-anchor="middle" font-weight="600">
    No Image Available
  </text>
  <text x="400" y="450" font-family="system-ui, -apple-system, sans-serif" 
        font-size="15" fill="#94a3b8" text-anchor="middle" font-weight="400">
    Upload images to showcase this property
  </text>
</svg>
