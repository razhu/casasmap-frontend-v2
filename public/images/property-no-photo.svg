<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Simple flat background -->
  <rect width="800" height="600" fill="#f1f5f9"/>
  
  <!-- Camera icon - minimal -->
  <g transform="translate(300, 220)">
    <!-- Camera body -->
    <rect x="0" y="30" width="200" height="120" 
          fill="none"
          stroke="#94a3b8" 
          stroke-width="4"
          rx="8"/>
    
    <!-- Camera top -->
    <rect x="70" y="0" width="60" height="35" 
          fill="none"
          stroke="#94a3b8" 
          stroke-width="4"
          rx="6"/>
    
    <!-- Lens circle -->
    <circle cx="100" cy="90" r="35" 
            fill="none"
            stroke="#94a3b8" 
            stroke-width="4"/>
    
    <!-- Slash -->
    <line x1="-10" y1="10" x2="210" y2="160" 
          stroke="#94a3b8" 
          stroke-width="5"
          stroke-linecap="round"/>
  </g>
</svg>
